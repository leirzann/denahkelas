<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengacak Tempat duduk kelas XI-3</title>
    <!-- Tailwind CSS untuk UI yang modern -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s ease-in-out forwards;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.9); border-color: rgba(16, 185, 129, 1); }
        }
        .shuffling {
            animation: pulseGlow 0.4s infinite alternate;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6">

    <!-- Header / Judul -->
    <header class="text-center my-2">
        <h1 class="text-3xl font-extrabold tracking-wide bg-gradient-to-r from-emerald-400 to-cyan-500 bg-clip-text text-transparent">
            Denah Kelas XI-3
        </h1>
        <p class="text-slate-400 text-xs sm:text-sm mt-1">Sistem Rolling setiap minggu</p>
    </header>

    <!-- Meja Guru (Bagian Depan) -->
    <div class="w-full max-w-6xl flex justify-center my-3">
        <div class="bg-slate-900 border border-emerald-500/30 px-12 py-2 rounded-xl text-center shadow-lg text-emerald-400 font-bold tracking-widest text-sm uppercase">
            Papan Tulis & Meja Guru 👨‍🏫
        </div>
    </div>

    <!-- Container Denah Kelas (5 Baris x 8 Kolom) -->
    <main class="w-full max-w-6xl bg-slate-900/60 backdrop-blur-md border border-slate-800 p-6 rounded-2xl shadow-2xl overflow-x-auto">
        <div id="classroom-grid" class="grid grid-cols-8 gap-3 min-w-[700px]">
            <!-- Kursi akan digenerate otomatis lewat Javascript -->
        </div>
    </main>

    <!-- Tombol Aksi -->
    <div class="my-6 flex gap-4">
        <button id="shuffle-btn" onclick="startShuffleProcess()" class="bg-gradient-to-r from-emerald-500 to-cyan-600 hover:from-emerald-400 hover:to-cyan-500 text-slate-950 font-bold px-8 py-3 rounded-xl shadow-lg transition-all transform hover:scale-105 active:scale-95 cursor-pointer flex items-center gap-2">
             Acak Posisi tempat duduk!
        </button>
    </div>

    <!-- Footer -->
    <footer class="text-slate-500 text-xs">
        Sistem Denah Otomatis Kelas XI-3 
    </footer>

    <script>
        // ==========================================
        //         PERSENTASE SISWA 1 BANDING 8
        // ==========================================
        const studentsWithWeight = [
            { name: "Syauqi", weight: 5 },
            { name: "Adella", weight: 5 },
            { name: "Syafira", weight: 5 },
            { name: "Raka", weight: 5 },
            { name: "Bram", weight: 5 },
            { name: "Agung", weight: 5 },
            { name: "Samsul", weight: 5 },
            { name: "M. Fahri", weight: 5 },
            { name: "Siniora", weight: 5 },
            { name: "Permana", weight: 5 },
            { name: "Fahiz", weight: 5 },
            { name: "Farel", weight: 6 },
            { name: "Aravie", weight: 5 },
            { name: "Chiko", weight: 5 },
            { name: "Niko", weight: 5 },
            { name: "Fitria", weight: 5 },
            { name: "Bima", weight: 5 },
            { name: "Syifa", weight: 5 },
            { name: "Syamil", weight: 6 },
            { name: "Andita", weight: 5 },
            { name: "Algi", weight: 5 },
            { name: "Dania", weight: 5 },
            { name: "Kaindra", weight: 5 },
            { name: "Kaisha", weight: 5 },
            { name: "Fahri Akbar", weight: 5 },
            { name: "Khaznatun", weight: 5 },
            { name: "Adrian", weight: 5 },
            { name: "Radit", weight: 5 },
            { name: "Adel", weight: 5 },
            { name: "Qunsha", weight: 5 },
            { name: "Daffa", weight: 5 },
            { name: "Rifqi", weight: 5 },
            { name: "Raafi", weight: 5 }
        ];

        function getWeightedShuffledList() {
            let weightedArray = [...studentsWithWeight];
            weightedArray.sort((a, b) => {
                let scoreA = Math.random() * (1 / a.weight);
                let scoreB = Math.random() * (1 / b.weight);
                return scoreA - scoreB;
            });
            return weightedArray.map(s => s.name);
        }

        function renderEmptyGrid() {
            const gridContainer = document.getElementById('classroom-grid');
            gridContainer.innerHTML = '';
            const totalSlots = 40;

            for (let i = 0; i < totalSlots; i++) {
                const rowNumber = Math.floor(i / 8) + 1;
                const colNumber = (i % 8) + 1;
                const isFrontRow = rowNumber === 1;

                const seatCard = document.createElement('div');
                seatCard.id = `seat-${i}`;
                seatCard.className = `p-3 rounded-xl border flex flex-col items-center justify-center text-center transition-all min-h-[75px] ${
                    isFrontRow ? 'bg-emerald-950/30 border-emerald-500/40 shadow-sm' : 'bg-slate-900 border-slate-800 shadow-sm'
                }`;

                seatCard.innerHTML = `
                    <div class="flex items-center justify-between w-full mb-1">
                        <span class="text-[10px] ${isFrontRow ? 'text-emerald-400 font-bold' : 'text-slate-500'}">B${rowNumber}-K${colNumber}</span>
                        ${isFrontRow ? '<span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded">Depan</span>' : ''}
                    </div>
                    <span class="font-medium text-xs sm:text-sm italic text-slate-600">
                        Menunggu...
                    </span>
                `;
                gridContainer.appendChild(seatCard);
            }
        }

        function startShuffleProcess() {
            const btn = document.getElementById('shuffle-btn');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.innerText = " .......... ";

            const totalSlots = 40;
            let finalShuffled = getWeightedShuffledList();
            let allNames = studentsWithWeight.map(s => s.name);

            // Tahap 1: Efek acak kilat sebentar
            let counter = 0;
            let interval = setInterval(() => {
                for (let i = 0; i < totalSlots; i++) {
                    const card = document.getElementById(`seat-${i}`);
                    if (card) {
                        card.className = `p-3 rounded-xl border flex flex-col items-center justify-center text-center transition-all min-h-[75px] shuffling bg-emerald-950/60 border-emerald-500`;
                        const nameSpan = card.querySelector('.font-medium');
                        const tempName = allNames[Math.floor(Math.random() * allNames.length)];
                        nameSpan.innerText = i < studentsWithWeight.length ? tempName : 'Kosong';
                        nameSpan.className = "font-medium text-xs sm:text-sm text-emerald-400";
                    }
                }
                counter++;
                if (counter > 10) {
                    clearInterval(interval);
                    // Tahap 2: Reveal satu per satu dengan tempo lambat
                    revealSeatsOneByOne(finalShuffled);
                }
            }, 100);
        }

        function revealSeatsOneByOne(finalShuffled) {
            const totalSlots = 40;
            let currentIndex = 0;

            // Tempo diperlambat menjadi 600ms per kursi agar sangat dramatis dan menegangkan
            let revealInterval = setInterval(() => {
                if (currentIndex < totalSlots) {
                    const card = document.getElementById(`seat-${currentIndex}`);
                    if (card) {
                        const studentName = finalShuffled[currentIndex] || null;
                        const rowNumber = Math.floor(currentIndex / 8) + 1;
                        const colNumber = (currentIndex % 8) + 1;
                        const isFrontRow = rowNumber === 1;

                        card.className = `p-3 rounded-xl border flex flex-col items-center justify-center text-center transition-all animate-pop min-h-[75px] ${
                            !studentName 
                                ? 'bg-slate-950/40 border-dashed border-slate-800 text-slate-700' 
                                : isFrontRow 
                                    ? 'bg-emerald-950/30 border-emerald-500/40 shadow-sm' 
                                    : 'bg-slate-800 border-slate-700 shadow-sm'
                        }`;

                        card.innerHTML = `
                            <div class="flex items-center justify-between w-full mb-1">
                                <span class="text-[10px] ${isFrontRow ? 'text-emerald-400 font-bold' : 'text-slate-500'}">B${rowNumber}-K${colNumber}</span>
                                ${isFrontRow && studentName ? '<span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded">Depan</span>' : ''}
                            </div>
                            <span class="font-medium text-xs sm:text-sm ${!studentName ? 'italic text-slate-600' : 'text-emerald-300'}">
                                ${studentName || 'Kosong'}
                            </span>
                        `;
                    }
                    currentIndex++;
                } else {
                    clearInterval(revealInterval);
                    const btn = document.getElementById('shuffle-btn');
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.innerText = "🎲 Acak Posisi";
                }
            }, 600); // 600 milidetik per kursi (bisa ditambah atau dikurangi jika ingin lebih lambat/cepat)
        }

        window.onload = () => {
            renderEmptyGrid();
            let initialList = getWeightedShuffledList();
            for(let i=0; i<40; i++) {
                const card = document.getElementById(`seat-${i}`);
                if(card) {
                    const studentName = initialList[i] || null;
                    const rowNumber = Math.floor(i / 8) + 1;
                    const colNumber = (i % 8) + 1;
                    const isFrontRow = rowNumber === 1;

                    card.className = `p-3 rounded-xl border flex flex-col items-center justify-center text-center transition-all min-h-[75px] ${
                        !studentName ? 'bg-slate-950/40 border-dashed border-slate-800 text-slate-700' : isFrontRow ? 'bg-emerald-950/30 border-emerald-500/40 shadow-sm' : 'bg-slate-800 border-slate-700 shadow-sm'
                    }`;
                    card.innerHTML = `
                        <div class="flex items-center justify-between w-full mb-1">
                            <span class="text-[10px] ${isFrontRow ? 'text-emerald-400 font-bold' : 'text-slate-500'}">B${rowNumber}-K${colNumber}</span>
                            ${isFrontRow && studentName ? '<span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded">Depan</span>' : ''}
                        </div>
                        <span class="font-medium text-xs sm:text-sm ${!studentName ? 'italic text-slate-600' : 'text-emerald-300'}">
                            ${studentName || 'Kosong'}
                        </span>
                    `;
                }
            }
        };
    </script>
</body>
</html>
